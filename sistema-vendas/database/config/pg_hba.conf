# =============================================================================
# Grupo 2 - Sistema de Vendas
# pg_hba.conf: quem pode se conectar, por qual meio, em qual banco e como se autentica
#
# Montado no container em /etc/postgresql/pg_hba.conf e ativado com
# "-c hba_file=..." no docker-compose.yml.
#
# O PostgreSQL percorre as linhas de cima para baixo e usa a PRIMEIRA que
# combinar com a conexão (tipo, banco, usuário e origem). Se essa linha for
# "reject", ou se nenhuma linha combinar, a conexão é recusada.
#
# Por que as regras são por USUÁRIO e não por IP de origem:
#   No Docker Desktop os containers rodam dentro de uma máquina virtual, e toda
#   conexão vinda de fora do container chega ao PostgreSQL com o MESMO IP de
#   origem (192.168.65.1, o gateway interno do Docker Desktop), tanto da nossa
#   API nesta máquina (via localhost) quanto de outra máquina da rede. Isso foi
#   medido com inet_client_addr(). Então uma regra como "grupo2 só a partir
#   desta máquina" não tem como ser escrita por IP.
#   Solução: o superusuário grupo2 não tem NENHUMA regra TCP (só socket local
#   do container), e a API usa o grupo2_app, que não é superusuário.
# =============================================================================

# TIPO  BANCO      USUÁRIO            ORIGEM       MÉTODO

# Superusuário grupo2 só pelo socket Unix dentro do container: scripts de
# criação (docker-entrypoint), npm run db:psql e docker exec. Só chega aqui quem
# já tem acesso ao Docker desta máquina, por isso "trust" (sem senha).
local   all        grupo2                          trust

# API do Sistema de Vendas: via TCP, só no banco grupo2_db, com senha (SCRAM).
# Origem livre: pelo Docker Desktop a API sempre chega como 192.168.65.1.
host    grupo2_db  grupo2_app         0.0.0.0/0    scram-sha-256

# Grupo 4 - Estoque: via TCP, de qualquer IP da rede, só no banco grupo2_db, com senha (SCRAM).
host    grupo2_db  grupo4_integracao  0.0.0.0/0    scram-sha-256

# Qualquer outra conexão TCP via IPv4 é recusada: grupo2 pela rede, outros bancos, outros usuários.
host    all        all                0.0.0.0/0    reject

# Qualquer conexão TCP via IPv6 é recusada.
host    all        all                ::/0         reject

# Qualquer outro usuário pelo socket local é recusado.
local   all        all                             reject
